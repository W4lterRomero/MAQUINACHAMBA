name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          SIMULATION_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          APP_SECRET_KEY: "ci-test-key-not-for-production-min-32-chars"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check for secrets in application source
        run: python scripts/check_secrets.py backend/app frontend/src
